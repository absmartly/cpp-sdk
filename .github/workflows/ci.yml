name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DABSMARTLY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package

      - name: Check packages with a find_package consumer
        run: |
          for archive in build/absmartly-cpp-sdk-*.tar.gz build/absmartly-cpp-sdk-*.zip; do
            dir="$RUNNER_TEMP/pkg-$(basename "$archive")"
            mkdir -p "$dir"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$dir" ;;
              *) tar xzf "$archive" -C "$dir" ;;
            esac
            cmake -S tests/package_consumer -B "$dir-consumer" \
              -DCMAKE_PREFIX_PATH="$(echo "$dir"/absmartly-cpp-sdk-*)"
            cmake --build "$dir-consumer"
            agent=$("$dir-consumer/consumer")
            echo "$archive: $agent"
          done

      - name: Check an add_subdirectory consumer keeps its own install and package
        run: |
          dir="$RUNNER_TEMP/subdirectory-consumer"
          cmake -S tests/subdirectory_consumer -B "$dir" -DABSMARTLY_SDK_SOURCE_DIR="$PWD"
          cmake --build "$dir" --parallel
          "$dir/app"
          cmake --install "$dir" --prefix "$dir/prefix"
          installed=$(cd "$dir/prefix" && find . -type f | sort)
          echo "$installed"
          test "$installed" = "./bin/app"
          grep -q 'set(CPACK_PACKAGE_NAME "embedding-app")' "$dir/CPackConfig.cmake"
          grep -q 'set(CPACK_GENERATOR "TGZ")' "$dir/CPackConfig.cmake"
